name: Build Release

on:
  push:
    branches: [ci]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build x64 Release
        run: msbuild SbieKernelPatch.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Stage release files
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter SbieKernelPatch.exe |
            Where-Object { $_.FullName -match 'x64\\Release' } |
            Select-Object -First 1
          if (-not $exe) { throw "SbieKernelPatch.exe not found" }
          "Found: $($exe.FullName)"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe.FullName dist\SbieKernelPatch.exe -Force
          Copy-Item README.md dist\README.md -Force
          Copy-Item LICENSE dist\LICENSE -Force

          $notes = @(
            "SbieKernelPatch - Release x64 build",
            "====================================",
            "",
            "This package contains the user-mode tool only.",
            "",
            "The vulnerable kernel driver used by the tool",
            "(TBT_Force_Power_Control_Access64.sys) is NOT included in this repository",
            "and is not part of this archive. Place it next to SbieKernelPatch.exe",
            "before running the tool.",
            "",
            "Run as Administrator, from the Sandboxie-Plus installation directory,",
            "with the Microsoft vulnerable driver blocklist disabled.",
            "Use -h for command line options."
          )
          $notes | Out-File -FilePath dist\BUILD-NOTES.txt -Encoding utf8

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath SbieKernelPatch-x64.zip -Force
          $h = Get-FileHash SbieKernelPatch-x64.zip -Algorithm SHA256
          "SHA256: $($h.Hash)"
          $h.Hash | Out-File -FilePath SbieKernelPatch-x64.zip.sha256 -Encoding ascii
          Get-ChildItem SbieKernelPatch-x64.zip, SbieKernelPatch-x64.zip.sha256 | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: SbieKernelPatch-x64
          path: |
            SbieKernelPatch-x64.zip
            SbieKernelPatch-x64.zip.sha256
          retention-days: 30
